[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ha-tigotell-dev"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "homeassistant>=2026.9,<2027.0",
  "pytest-homeassistant-custom-component>=0.13.200",
  "pytest>=8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["custom_components/tigotell"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
