name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install test dependencies
        run: python -m pip install -e tigotell_client -e . pytest pytest-homeassistant-custom-component ruff
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Dashboard card syntax
        run: node --check dashboard/tigotell-panel-card.js
      - name: Pytest
        run: pytest
