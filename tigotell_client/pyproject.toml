[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tigotell-client"
version = "0.1.0"
description = "Async Python client for gongloo/TigoTell"
readme = "README.md"
requires-python = ">=3.12"
authors = [{name = "TigoTell Home Assistant Integration", email = "ha-tigotell.expensive887@passmail.net"}]
license = {text = "MIT"}
dependencies = ["aiohttp>=3.10,<4"]

[tool.hatch.build.targets.wheel]
packages = ["tigotell_client"]
