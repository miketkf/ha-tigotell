views:
  - type: sections
    title: Solar panels
    max_columns: 4
    dense_section_placement: true
    badges:
      - type: entity
        entity: sensor.tigotell_total_panel_power
      - type: entity
        entity: sensor.tigotell_reporting_panels
    sections:
      - type: grid
        column_span: 4
        cards:
          - type: custom:tigotell-panel-card
            min: 0
            max: 390
            severity:
              green: 200
              yellow: 100
              red: 0